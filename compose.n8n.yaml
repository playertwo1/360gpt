name: visao-360

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [data]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_URL: http://localhost:5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: America/Sao_Paulo
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: America/Sao_Paulo
      AUTO_PROMOTION_ENABLED: ${AUTO_PROMOTION_ENABLED:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_TASK_TIMEOUT: 420
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_RUNNER_ENV_ACCESS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_TIMEOUT: 420
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows:ro
      - ./.local:/files/local:ro
      - ./AGENTS.md:/files/contracts/AGENTS.md:ro
      - ./contracts:/files/contracts/schemas:ro
      - ./policies:/files/policies:ro
      - ./docs/arquitetura-agentes-360:/files/agents:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [frontend, data]

  docling:
    profiles: ["processing"]
    image: ghcr.io/docling-project/docling-serve@sha256:0ccbc00b5f8b443334a7c4f36a5c6ff89c684c6fbe18ff7c1bc41e00b8e01657
    restart: unless-stopped
    environment:
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: 2
      DOCLING_PERF_PAGE_BATCH_SIZE: 1
      DOCLING_PERF_ELEMENTS_BATCH_SIZE: 1
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_MAX_NUM_PAGES: 80
      DOCLING_SERVE_MAX_FILE_SIZE: 20971520
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: 300
      DOCLING_SERVE_MAX_SYNC_WAIT: 300
      UVICORN_WORKERS: 1
    expose: ["5001"]
    volumes:
      - docling_models:/opt/app-root/src/.cache/docling
    mem_limit: 3g
    cpus: 2.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    networks: [frontend]

  document-worker:
    profiles: ["processing"]
    build:
      context: ./services/document-worker
    restart: unless-stopped
    depends_on:
      docling:
        condition: service_healthy
    environment:
      DOCUMENT_MAX_BYTES: 20971520
      DOCUMENT_MAX_PDF_PAGES: 80
      DOCUMENT_MAX_TEXT_CHARS: 200000
      DOCUMENT_DOCLING_ENABLED: "true"
      DOCLING_API_URL: http://docling:5001
      DOCLING_TIMEOUT_SECONDS: 300
      DOCLING_POLL_INTERVAL_SECONDS: 2
    expose: ["8787"]
    read_only: true
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [frontend]

  telegram-poller:
    profiles: ["telegram-local"]
    build:
      context: ./services/telegram-poller
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - .env.n8n
    environment:
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      N8N_TELEGRAM_INGRESS_URL: http://n8n:5678/webhook/director-360/telegram/inbound
      DIRECTOR360_TRANSPORT_SECRET: ${BRIDGE_SHARED_SECRET:?BRIDGE_SHARED_SECRET must be set in .env.n8n}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET:?BRIDGE_SHARED_SECRET must be set in .env.n8n}
      TELEGRAM_LONG_POLL_SECONDS: 25
      TELEGRAM_RETRY_SECONDS: 5
    expose: ["8790"]
    volumes:
      - telegram_poller_data:/var/lib/director360
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [frontend]

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [frontend]

volumes:
  postgres_data:
  n8n_data:
  docling_models:
  telegram_poller_data:

networks:
  frontend:
  data:
    internal: true
