name: visao-360

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_URL: http://localhost:5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_TASK_TIMEOUT: 420
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_RUNNER_ENV_ACCESS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_TIMEOUT: 420
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows:ro
      - ./.local:/files/local:ro
      - ./AGENTS.md:/files/contracts/AGENTS.md:ro
      - ./contracts:/files/contracts/schemas:ro
      - ./policies:/files/policies:ro
      - ./docs/arquitetura-agentes-360:/files/agents:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - frontend
      - data

  document-worker:
    build:
      context: ./services/document-worker
    restart: unless-stopped
    environment:
      DOCUMENT_MAX_BYTES: 20971520
      DOCUMENT_MAX_PDF_PAGES: 80
      DOCUMENT_MAX_TEXT_CHARS: 200000
      DOCUMENT_OCR_LANGUAGE: por+eng
      DOCUMENT_DOCLING_ENABLED: "true"
      DOCLING_API_URL: http://docling:5001
      DOCLING_TIMEOUT_SECONDS: 300
      DOCLING_POLL_INTERVAL_SECONDS: 2
      DOCUMENT_MINERU_ENABLED: "false"
      MINERU_API_URL: http://mineru:8000
      MINERU_PDF_PRIMARY_BACKEND: pipeline
      MINERU_IMAGE_BACKEND: hybrid-engine
      MINERU_HYBRID_ESCALATION_ENABLED: "true"
      MINERU_COMPLEX_TABLE_MIN_ROWS: 8
      MINERU_COMPLEX_TABLE_MIN_CELLS: 40
      MINERU_EFFORT: medium
      MINERU_TIMEOUT_SECONDS: 330
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - frontend

  docling:
    image: ghcr.io/docling-project/docling-serve@sha256:0ccbc00b5f8b443334a7c4f36a5c6ff89c684c6fbe18ff7c1bc41e00b8e01657
    restart: unless-stopped
    environment:
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: 2
      DOCLING_PERF_PAGE_BATCH_SIZE: 1
      DOCLING_PERF_ELEMENTS_BATCH_SIZE: 1
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_MAX_NUM_PAGES: 80
      DOCLING_SERVE_MAX_FILE_SIZE: 20971520
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: 300
      DOCLING_SERVE_MAX_SYNC_WAIT: 300
      UVICORN_WORKERS: 1
    expose:
      - "5001"
    volumes:
      - docling_models:/opt/app-root/src/.cache/docling
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    networks:
      - frontend

  mineru:
    profiles: ["mineru-manual"]
    image: diretor360/mineru:3.4.5
    build:
      context: ./services/mineru
    restart: "no"
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_API_MAX_CONCURRENT_REQUESTS: 1
      MINERU_PROCESSING_WINDOW_SIZE: 1
      MINERU_API_ENABLE_FASTAPI_DOCS: 0
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - frontend

volumes:
  postgres_data:
  n8n_data:
  docling_models:

networks:
  frontend:
  data:
    internal: true
