version: "1.11.0"
pricing_table_usd_per_1m_tokens:
  deterministic:
    input: 0.000000
    output: 0.000000
    latency_ms_p95: 5
  flash_lite:
    model_id: "gemini-3.5-flash-lite"
    input: 0.075
    output: 0.300
    latency_ms_p95: 450
  flash:
    model_id: "gemini-3.7-flash"
    input: 0.150
    output: 0.600
    latency_ms_p95: 950
  pro:
    model_id: "gemini-3.1-pro-preview"
